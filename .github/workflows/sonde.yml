name: Sonde appli web
on:
  push:
    branches: [claude/confident-tesla-66kxrr]
    paths: [".github/workflows/sonde.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in index.html app-1.js app-2.js app-3.js style.css manifest.json icone-180.png icone-192.png icone-512.png; do
            chemin=$f; [ $f = index.html ] && chemin=""
            curl -sS -o /tmp/f -w "$f %{http_code} %{content_type} " "https://jour-un-three.vercel.app/$chemin"
            if cmp -s /tmp/f jour-un/webapp/$f; then echo IDENTIQUE; else echo DIFFERENT; fi
          done
          curl -sSI https://jour-un-three.vercel.app/ | grep -i -E "x-robots|cache-control|x-vercel"
