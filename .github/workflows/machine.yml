name: Machine web-design.ch

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["jour-un/**"]

permissions:
  contents: read

env:
  SUPABASE_URL: https://pnngtkpweyjohbjkremi.supabase.co

jobs:
  decision:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.decision.outputs.lancer }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: jour-un/automatisation
      - id: decision
        name: Faut-il lancer la machine ?
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          EVENEMENT_CRON: ${{ github.event.schedule }}
        run: python3 jour-un/automatisation/decision.py

  machine:
    needs: decision
    if: needs.decision.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: machine-jour-un
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r jour-un/requirements.txt

      - name: Récupérer la mémoire de la machine
        uses: actions/cache/restore@v4
        with:
          path: jour-un/automatisation/donnees
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      - name: Trouver les nouvelles entreprises et préparer leurs kits
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          COCKPIT_MOT_DE_PASSE: ${{ secrets.COCKPIT_MOT_DE_PASSE }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: python jour-un/automatisation/machine.py --exiger-chiffrement --sortie _site

      - name: Sauvegarder la mémoire de la machine
        uses: actions/cache/save@v4
        with:
          path: jour-un/automatisation/donnees
          key: donnees-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Garder les lancements automatiques actifs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/machine.yml/enable" || true
