<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit fiche Google</title>
<style>
:root{--c:#0b63ce;--ink:#14161a;--muted:#5b616e;--line:#e4e6ea;--soft:#f4f5f7;--bad:#c62828;--mid:#e08a00;--good:#1b873f}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--soft);margin:0;line-height:1.5}
.page{max-width:900px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:18px;margin:28px 0 10px}
.muted{color:var(--muted)}
form,.rapport{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
button{background:var(--c);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:18px}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.rapport{margin-top:24px}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cercle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.pb{border-left:4px solid var(--bad);padding:8px 12px;margin:8px 0;background:#fff7f7;border-radius:0 8px 8px 0}
.pb.moyen{border-color:var(--mid);background:#fffaf0}
.ok{border-left:4px solid var(--good);padding:8px 12px;margin:8px 0;background:#f4fbf6;border-radius:0 8px 8px 0}
.offre{background:var(--ink);color:#fff;border-radius:12px;padding:18px;margin-top:24px}
@media print{body{background:#fff}form,.no-print{display:none}.rapport{border:0;margin:0;padding:0}.page{padding:0}}
</style>
</head>
<body>
<div class="page">
  <div class="no-print">
    <h1>Audit gratuit de fiche Google</h1>
    <p class="muted">Remplis en 10 minutes à partir de Google Maps (fiche du prospect + ses 2 principaux concurrents sur la recherche « métier + ville »), puis imprime ou enregistre en PDF.</p>
  </div>

  <form id="f">
    <h2 style="margin-top:0">Prospect</h2>
    <div class="cols">
      <div><label>Nom de l'entreprise</label><input name="nom" required placeholder="Plomberie Martin"></div>
      <div><label>Recherche testée</label><input name="recherche" required placeholder="plombier villeurbanne"></div>
      <div><label>Position sur Google Maps</label><select name="position"><option value="3">Top 3</option><option value="6">4 à 6</option><option value="10">7 à 10</option><option value="99">Au-delà / introuvable</option></select></div>
      <div><label>Note moyenne</label><input name="note" type="number" step="0.1" min="0" max="5" required placeholder="4.2"></div>
      <div><label>Nombre d'avis</label><input name="avis" type="number" min="0" required placeholder="12"></div>
      <div><label>Dernier avis reçu il y a</label><select name="recence"><option value="30">Moins d'1 mois</option><option value="90">1 à 3 mois</option><option value="999">Plus de 3 mois</option></select></div>
      <div><label>Réponses aux avis</label><select name="reponses"><option value="toutes">À presque tous</option><option value="certaines">À quelques-uns</option><option value="aucune">Aucune</option></select></div>
      <div><label>Nombre de photos</label><input name="photos" type="number" min="0" required placeholder="4"></div>
      <div><label>Site internet</label><select name="site"><option value="ok">Oui, correct</option><option value="vieux">Oui, vieux / pas mobile</option><option value="non">Non</option></select></div>
      <div><label>Horaires renseignés</label><select name="horaires"><option value="1">Oui</option><option value="0">Non</option></select></div>
      <div><label>Description remplie</label><select name="description"><option value="1">Oui</option><option value="0">Non / très courte</option></select></div>
      <div><label>Services / produits listés</label><select name="services"><option value="1">Oui</option><option value="0">Non</option></select></div>
      <div><label>Actualités (posts) Google</label><select name="posts"><option value="1">Oui, ce mois-ci</option><option value="0">Non / anciennes</option></select></div>
    </div>

    <h2>Concurrents mieux placés</h2>
    <div class="cols">
      <div><label>Concurrent 1 — nom</label><input name="c1n" placeholder="Plomberie Dupuis"></div>
      <div><label>Note</label><input name="c1note" type="number" step="0.1" min="0" max="5"></div>
      <div><label>Nb d'avis</label><input name="c1avis" type="number" min="0"></div>
    </div>
    <div class="cols" style="margin-top:12px">
      <div><label>Concurrent 2 — nom</label><input name="c2n"></div>
      <div><label>Note</label><input name="c2note" type="number" step="0.1" min="0" max="5"></div>
      <div><label>Nb d'avis</label><input name="c2avis" type="number" min="0"></div>
    </div>

    <h2>Toi</h2>
    <div class="cols">
      <div><label>Ton nom</label><input name="moi" placeholder="Prénom Nom"></div>
      <div><label>Ton téléphone</label><input name="moitel" placeholder="06 ..."></div>
      <div><label>Prix mise en place (€)</label><input name="setup" type="number" value="190"></div>
      <div><label>Prix mensuel (€)</label><input name="mois" type="number" value="149"></div>
    </div>
    <button type="submit">Générer le rapport</button>
  </form>

  <div id="rapport" class="rapport" hidden></div>
</div>

<script>
const f = document.getElementById('f');
const out = document.getElementById('rapport');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

f.addEventListener('submit', ev => {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const note = +d.note, avis = +d.avis, photos = +d.photos;
  const concurrents = [[d.c1n, d.c1note, d.c1avis], [d.c2n, d.c2note, d.c2avis]]
    .filter(c => c[0]).map(c => ({nom: c[0], note: +c[1] || 0, avis: +c[2] || 0}));
  const moyAvis = concurrents.length ? concurrents.reduce((s, c) => s + c.avis, 0) / concurrents.length : avis;

  const pts = [], pbs = [], oks = [];
  const crit = (score, max, grave, texteKo, texteOk) => {
    pts.push(score);
    if (score >= max) oks.push(texteOk);
    else pbs.push({grave: score <= max / 3 && grave, texte: texteKo});
  };

  crit(note >= 4.5 ? 15 : note >= 4 ? 10 : 3, 15, true,
    `Note de ${note}/5 : sous 4,5, une partie des clients choisit directement le concurrent mieux noté.`,
    `Très bonne note (${note}/5).`);
  crit(avis >= moyAvis ? 15 : avis >= moyAvis / 2 ? 8 : 2, 15, true,
    `${avis} avis contre ${Math.round(moyAvis)} en moyenne chez vos concurrents : le nombre d'avis est un des premiers critères de classement Google Maps.`,
    `Nombre d'avis au niveau de la concurrence (${avis}).`);
  crit(d.recence === '30' ? 10 : d.recence === '90' ? 5 : 0, 10, true,
    `Pas d'avis récent : Google et les clients privilégient les entreprises qui reçoivent des avis régulièrement.`,
    `Avis récents réguliers.`);
  crit(d.reponses === 'toutes' ? 10 : d.reponses === 'certaines' ? 5 : 0, 10, true,
    `Les avis ne reçoivent pas tous de réponse : c'est un signal d'activité pour Google et de sérieux pour les clients.`,
    `Réponses aux avis systématiques.`);
  crit(photos >= 20 ? 10 : photos >= 5 ? 5 : 0, 10, true,
    `Seulement ${photos} photo(s) : les fiches avec beaucoup de photos récentes reçoivent nettement plus de clics et d'appels.`,
    `Galerie photo bien fournie.`);
  crit(d.site === 'ok' ? 10 : d.site === 'vieux' ? 5 : 0, 10, true,
    d.site === 'non' ? `Pas de site internet : la fiche perd en crédibilité et en positionnement.` : `Site peu adapté au mobile : la majorité des recherches locales se font sur téléphone.`,
    `Site internet présent et correct.`);
  crit(+d.horaires * 5, 5, false, `Horaires non renseignés : des clients passent au concurrent faute de savoir si vous êtes ouvert.`, `Horaires renseignés.`);
  crit(+d.description * 5, 5, false, `Description absente ou trop courte : mots-clés manquants pour Google.`, `Description complète.`);
  crit(+d.services * 5, 5, false, `Services non listés : vous n'apparaissez pas sur certaines recherches précises.`, `Services listés.`);
  crit(+d.posts * 10, 10, false, `Aucune actualité Google récente : la fiche paraît inactive.`, `Publications Google régulières.`);
  const pos = +d.position;
  crit(pos <= 3 ? 5 : pos <= 6 ? 3 : 0, 5, true,
    pos === 99 ? `Introuvable sur « ${d.recherche} » : les clients qui cherchent ne vous voient pas du tout.` : `Hors du top 3 sur « ${d.recherche} » : les 3 premiers résultats reçoivent l'essentiel des appels.`,
    `Dans le top 3 sur « ${d.recherche} ».`);

  const score = pts.reduce((a, b) => a + b, 0);
  const couleur = score >= 75 ? 'var(--good)' : score >= 50 ? 'var(--mid)' : 'var(--bad)';
  const verdict = score >= 75 ? 'Bonne base, quelques optimisations possibles.' : score >= 50 ? 'Des clients vous échappent au profit de vos concurrents.' : 'Votre fiche vous fait perdre une grande partie des clients qui vous cherchent.';
  pbs.sort((a, b) => b.grave - a.grave);

  const lignes = [{nom: d.nom + ' (vous)', note, avis}, ...concurrents]
    .map(c => `<tr><td>${esc(c.nom)}</td><td>${c.note || '–'}</td><td>${c.avis}</td></tr>`).join('');

  out.innerHTML = `
    <h1>Audit de visibilité Google — ${esc(d.nom)}</h1>
    <p class="muted">Recherche analysée : « ${esc(d.recherche)} » · ${new Date().toLocaleDateString('fr-FR')}</p>
    <div class="score"><div class="cercle" style="background:${couleur}">${score}</div>
      <div><b>Score : ${score}/100</b><br>${verdict}</div></div>
    <h2>Vous face à vos concurrents</h2>
    <table><tr><th>Entreprise</th><th>Note</th><th>Avis</th></tr>${lignes}</table>
    <h2>Points qui vous coûtent des clients (${pbs.length})</h2>
    ${pbs.map(p => `<div class="pb ${p.grave ? '' : 'moyen'}">${esc(p.texte)}</div>`).join('') || '<p>Aucun point bloquant.</p>'}
    ${oks.length ? `<h2>Ce qui va bien</h2>${oks.map(o => `<div class="ok">${esc(o)}</div>`).join('')}` : ''}
    <div class="offre">
      <b>Ce que je vous propose</b><br>
      Je m'occupe de tout, chaque mois : fiche Google optimisée, kit pour obtenir plus d'avis (QR code comptoir + message à envoyer aux clients),
      réponse à tous vos avis, publications Google, mini-site internet inclus et rapport mensuel.<br><br>
      <b>${esc(d.setup)} € de mise en place, puis ${esc(d.mois)} € / mois, sans engagement.</b><br>
      ${esc(d.moi)} · ${esc(d.moitel)}
    </div>
    <div class="no-print"><button onclick="window.print()">Imprimer / PDF</button> <button class="sec" onclick="document.getElementById('f').scrollIntoView()">Modifier</button></div>`;
  out.hidden = false;
  out.scrollIntoView({behavior: 'smooth'});
});
</script>
</body>
</html>
