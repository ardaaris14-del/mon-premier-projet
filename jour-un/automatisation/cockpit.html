<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cockpit — Jour Un</title>
<style>
:root{--c:#0b63ce;--ink:#14161a;--muted:#5b616e;--line:#e3e6eb;--soft:#f4f6f9;--ok:#1b873f;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--soft);color:var(--ink);line-height:1.45}
.page{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.muted{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filtres input[type=search],.filtres select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;flex:1 1 150px}
.filtres label{display:flex;align-items:center;gap:6px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.p.fait{opacity:.6}
.ligne{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nom{font-weight:700;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.tag.new{background:#e8f1fd;border-color:#b7d3f7;color:var(--c);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions a{font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.actions a.prim{background:var(--c);border-color:var(--c);color:#fff}
select.statut{padding:6px 8px;border-radius:8px;border:1px solid var(--line);font:inherit;font-size:14px}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.vide{text-align:center;padding:40px;color:var(--muted)}
.verrou{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.verrou input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:10px 0}
.verrou button{width:100%;background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.client{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.client .post{border-top:1px solid var(--line);padding:10px 0}
.client .post p{margin:4px 0}
</style>
</head>
<body>
<form class="verrou" id="verrou" hidden>
  <h1>Cockpit Jour Un</h1>
  <p class="muted" id="verrou-msg">Entre ton mot de passe (celui du secret COCKPIT_MOT_DE_PASSE).</p>
  <input type="password" id="mdp" autocomplete="current-password" placeholder="Mot de passe">
  <label class="muted"><input type="checkbox" id="retenir" checked> Se souvenir sur cet appareil</label>
  <button type="submit" style="margin-top:12px">Ouvrir</button>
</form>
<div class="page" id="contenu" hidden>
  <h1>Cockpit Jour Un</h1>
  <div class="muted" id="maj"></div>
  <div class="stats" id="stats"></div>
  <div class="filtres">
    <input type="search" id="q" placeholder="Rechercher un nom, une ville…">
    <select id="fm"><option value="">Tous les métiers</option></select>
    <select id="fs">
      <option value="actifs">À traiter</option><option value="">Tous les statuts</option>
    </select>
    <label><input type="checkbox" id="fn"> Arrivés cette semaine</label>
    <label><input type="checkbox" id="ft"> Avec téléphone</label>
  </div>
  <div id="liste"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">
    <button id="plus" hidden>Voir plus</button>
    <button id="export">Exporter le suivi (CSV)</button>
  </div>
  <h2 style="margin-top:32px">Mes clients : publications du mois</h2>
  <div id="clients"></div>
  <p class="muted">Les statuts sont enregistrés dans ce navigateur. Utilise toujours le même téléphone ou ordinateur, et exporte le suivi de temps en temps.</p>
</div>

<script>
const CHARGE = __DONNEES__;
let D;
const STATUTS = ["À contacter", "Kit envoyé", "Relancé", "Intéressé", "Client", "Pas intéressé"];
const FINIS = ["Client", "Pas intéressé"];
const CLE = "vl-suivi";
let suivi = {};
try { suivi = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) {}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(suivi)); } catch (e) {} };
const statut = id => (suivi[id] && suivi[id].statut) || "À contacter";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc = encodeURIComponent;
const jours = (a, b) => (new Date(b) - new Date(a)) / 864e5;

function demarrer() {
document.getElementById("contenu").hidden = false;
document.getElementById("verrou").hidden = true;
document.getElementById("maj").textContent =
  `Mis à jour le ${new Date(D.genere_le).toLocaleDateString("fr-FR")} · ${D.prospects.length} entreprises nouvelles avec leur kit prêt`;
for (const m of [...new Set(D.prospects.map(p => p.metier))])
  document.getElementById("fm").insertAdjacentHTML("beforeend", `<option value="${esc(m)}">${esc(D.metiers[m] || m)}</option>`);
document.getElementById("clients").innerHTML = (D.clients || []).map(c => `<div class="client"><b>${esc(c.nom)}</b>${
  c.posts.map((p, i) => `<div class="post"><b>Semaine ${i + 1} — ${esc(p.titre)}</b><p>${esc(p.texte)}</p>
  <p class="muted">Visuel : ${esc(p.visuel)}</p><button data-copie="${esc(p.texte)}">Copier</button></div>`).join("")}</div>`).join("")
  || '<p class="muted">Ajoute tes clients dans clients.json pour recevoir leurs publications chaque mois.</p>';
dessiner();
}
for (const s of STATUTS) document.getElementById("fs").insertAdjacentHTML("beforeend", `<option>${s}</option>`);

function numero(t) {
  const c = String(t || "").replace(/[^\d+]/g, "");
  if (/^0\d{9}$/.test(c)) return "+" + (D.indicatif || "33") + c.slice(1);
  return c.startsWith("00") ? "+" + c.slice(2) : c;
}
const MOBILE = { CH: /^\+417[5-9]\d{7}$/, FR: /^\+33[67]\d{8}$/ };
function remplir(modele, p) {
  const lien = p.kit ? new URL("../" + p.kit, location.href).href : "";
  const v = { nom: p.nom, lien, moi: D.moi.nom, tel: D.moi.telephone, ville: p.ville || "", metier: (D.metiers[p.metier] || p.metier).toLowerCase() };
  return modele.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
}
function contacte(id) {
  if (statut(id) === "À contacter") { suivi[id] = { statut: "Kit envoyé", date: new Date().toISOString().slice(0, 10) }; sauver(); dessiner(false); }
}

let limite = 40;
function filtres() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fm = document.getElementById("fm").value, fs = document.getElementById("fs").value;
  const fn = document.getElementById("fn").checked, ft = document.getElementById("ft").checked;
  return D.prospects.filter(p =>
    (!q || (p.nom + " " + p.ville + " " + p.adresse).toLowerCase().includes(q)) &&
    (!fm || p.metier === fm) &&
    (fs === "" || (fs === "actifs" ? !FINIS.includes(statut(p.id)) : statut(p.id) === fs)) &&
    (!fn || jours(p.premiere_detection, D.genere_le) <= 7) &&
    (!ft || p.telephone));
}

function carte(p) {
  const tel = numero(p.telephone), s = statut(p.id);
  const mobile = (MOBILE[D.pays] || MOBILE.FR).test(tel);
  const suisse = D.pays === "CH";
  const accord = suisse ? " (après accord)" : "";
  const nouveau = jours(p.premiere_detection, D.genere_le) <= 7;
  const a = [];
  if (p.kit) a.push(`<a class="prim" target="_blank" href="../${esc(p.kit)}">Voir son kit</a>`);
  a.push(`<a target="_blank" href="https://www.google.com/search?q=${enc(p.nom + " " + (p.ville || ""))}">Google</a>`);
  if (suisse) a.push(`<a target="_blank" href="https://search.ch/tel/?was=${enc(p.nom)}&wo=${enc(p.ville || "")}">Annuaire</a>`);
  if (tel) a.push(`<a data-c href="tel:${esc(tel)}">Appeler</a>`);
  if (tel && p.kit) a.push(`<a data-c href="sms:${esc(tel)}?&body=${enc(remplir(D.messages.sms, p))}">SMS${accord}</a>`);
  if (mobile && p.kit) a.push(`<a data-c target="_blank" href="https://wa.me/${tel.slice(1)}?text=${enc(remplir(D.messages.sms, p))}">WhatsApp${accord}</a>`);
  if (p.email && p.kit) a.push(`<a data-c href="mailto:${esc(p.email)}?subject=${enc(remplir(D.messages.email_objet, p))}&body=${enc(remplir(D.messages.email, p))}">Email${accord}</a>`);
  const tags = [...(nouveau ? ['<span class="tag new">Nouveau</span>'] : []), ...(p.raisons || []).map(r => `<span class="tag">${esc(r)}</span>`)];
  if (p.site_web) tags.push(`<a class="tag" target="_blank" href="${esc(/^https?:/.test(p.site_web) ? p.site_web : "https://" + p.site_web)}">A un site</a>`);
  return `<div class="p ${FINIS.includes(s) ? "fait" : ""}" data-id="${esc(p.id)}">
    <div class="ligne"><div><div class="nom">${esc(p.nom)}</div>
      <div class="muted">${esc(D.metiers[p.metier] || p.metier)} · ${esc(p.adresse || p.ville)}${p.telephone ? " · " + esc(p.telephone) : ""}</div>
      ${p.activite ? `<div class="muted" style="font-size:13px;margin-top:4px">${esc(p.activite.slice(0, 180))}${p.activite.length > 180 ? "…" : ""}</div>` : ""}</div>
      <select class="statut">${STATUTS.map(x => `<option ${x === s ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="tags">${tags.join("")}</div>
    <div class="actions">${a.join("")}</div></div>`;
}

function dessiner(reset = true) {
  if (reset) limite = 40;
  const liste = filtres();
  document.getElementById("liste").innerHTML = liste.slice(0, limite).map(carte).join("") ||
    '<div class="vide">Aucun prospect pour ces filtres.</div>';
  document.getElementById("plus").hidden = liste.length <= limite;
  const compte = s => D.prospects.filter(p => statut(p.id) === s).length;
  const nouveaux = D.prospects.filter(p => jours(p.premiere_detection, D.genere_le) <= 7).length;
  document.getElementById("stats").innerHTML = [["Nouveaux (7 j)", nouveaux], ["À contacter", compte("À contacter")],
    ["Kits envoyés", compte("Kit envoyé") + compte("Relancé")], ["Intéressés", compte("Intéressé")], ["Clients", compte("Client")]]
    .map(([l, n]) => `<div class="stat"><b>${n}</b><span class="muted">${l}</span></div>`).join("");
}

document.getElementById("liste").addEventListener("change", e => {
  if (!e.target.matches("select.statut")) return;
  const id = e.target.closest(".p").dataset.id;
  suivi[id] = { statut: e.target.value, date: new Date().toISOString().slice(0, 10) };
  sauver(); dessiner(false);
});
document.getElementById("liste").addEventListener("click", e => {
  const a = e.target.closest("a[data-c]");
  if (a) setTimeout(() => contacte(a.closest(".p").dataset.id), 300);
});
for (const id of ["q", "fm", "fs", "fn", "ft"]) document.getElementById(id).addEventListener("input", () => dessiner());
document.getElementById("plus").addEventListener("click", () => { limite += 40; dessiner(false); });
document.getElementById("export").addEventListener("click", () => {
  const lignes = [["nom", "metier", "ville", "telephone", "email", "statut", "date_statut", "kit"]];
  for (const p of D.prospects) lignes.push([p.nom, D.metiers[p.metier] || p.metier, p.ville, p.telephone, p.email, statut(p.id),
    (suivi[p.id] || {}).date || "", p.kit ? new URL("../" + p.kit, location.href).href : ""]);
  const csv = lignes.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `suivi-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
});
document.getElementById("clients").addEventListener("click", async e => {
  const b = e.target.closest("button[data-copie]");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copie); b.textContent = "Copié !"; } catch (err) {}
});

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function dechiffrer(c, mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(c.sel), iterations: c.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(c.iv) }, cle, b64(c.donnees));
  return JSON.parse(new TextDecoder().decode(clair));
}
async function ouvrir(mdp, retenir) {
  try {
    D = await dechiffrer(CHARGE.chiffre, mdp);
  } catch (e) {
    try { localStorage.removeItem("vl-mdp"); } catch (err) {}
    document.getElementById("verrou").hidden = false;
    document.getElementById("verrou-msg").textContent = "Mot de passe incorrect.";
    return;
  }
  if (retenir) { try { localStorage.setItem("vl-mdp", mdp); } catch (err) {} }
  demarrer();
}
if (CHARGE.manquant) {
  document.getElementById("verrou").hidden = false;
  document.getElementById("verrou").innerHTML = '<h1>Cockpit Jour Un</h1><p class="muted">Pour protéger les données, le cockpit est vide tant que le secret COCKPIT_MOT_DE_PASSE n\'est pas créé dans GitHub (voir le README).</p>';
} else if (CHARGE.chiffre) {
  let memo = null;
  try { memo = localStorage.getItem("vl-mdp"); } catch (e) {}
  if (memo) ouvrir(memo, true); else document.getElementById("verrou").hidden = false;
  document.getElementById("verrou").addEventListener("submit", e => {
    e.preventDefault();
    ouvrir(document.getElementById("mdp").value, document.getElementById("retenir").checked);
  });
} else {
  D = CHARGE;
  demarrer();
}
</script>
</body>
</html>
